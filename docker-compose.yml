x-flagsmith-env: &flagsmith-env
    DATABASE_URL: postgresql://${FLAGSMITH_DB_USER}:${FLAGSMITH_DB_PASSWORD}@postgres:5432/${FLAGSMITH_DB_NAME}
    DJANGO_SECRET_KEY: ${FLAGSMITH_SECRET_KEY}
    DJANGO_ALLOWED_HOSTS: ${FLAGSMITH_ALLOWED_HOST}
    FLAGSMITH_DOMAIN: ${FLAGSMITH_DOMAIN}
    ENVIRONMENT: production
    USE_POSTGRES_FOR_ANALYTICS: 'true'
    TASK_RUN_METHOD: SYNCHRONOUSLY

x-openfga-env: &openfga-env
    OPENFGA_DATASTORE_ENGINE: postgres
    OPENFGA_DATASTORE_URI: postgres://${OPENFGA_DB_USER}:${OPENFGA_DB_PASSWORD}@postgres:5432/${OPENFGA_DB_NAME}?sslmode=disable
    OPENFGA_AUTHN_METHOD: preshared
    OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_PRESHARED_KEY}

services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_SUPERUSER}
            POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
            POSTGRES_DB: postgres
            GLITCHTIP_DB_NAME: ${GLITCHTIP_DB_NAME}
            GLITCHTIP_DB_USER: ${GLITCHTIP_DB_USER}
            GLITCHTIP_DB_PASSWORD: ${GLITCHTIP_DB_PASSWORD}
            FLAGSMITH_DB_NAME: ${FLAGSMITH_DB_NAME}
            FLAGSMITH_DB_USER: ${FLAGSMITH_DB_USER}
            FLAGSMITH_DB_PASSWORD: ${FLAGSMITH_DB_PASSWORD}
            OPENFGA_DB_NAME: ${OPENFGA_DB_NAME}
            OPENFGA_DB_USER: ${OPENFGA_DB_USER}
            OPENFGA_DB_PASSWORD: ${OPENFGA_DB_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_SUPERUSER}']
            start_period: 30s
            interval: 10s
            timeout: 5s
            retries: 5

    valkey:
        image: valkey/valkey:8-alpine
        restart: unless-stopped
        volumes:
            - valkey-data:/data

    glitchtip:
        image: glitchtip/glitchtip:latest
        restart: unless-stopped
        environment:
            DATABASE_URL: postgres://${GLITCHTIP_DB_USER}:${GLITCHTIP_DB_PASSWORD}@postgres:5432/${GLITCHTIP_DB_NAME}
            VALKEY_URL: redis://valkey:6379
            SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
            EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
            DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL}
            GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
            ALLOWED_HOSTS: ${GLITCHTIP_ALLOWED_HOST}
            GLITCHTIP_EMBED_WORKER: 'True'
            ENABLE_USER_REGISTRATION: 'False'
        depends_on:
            postgres:
                condition: service_healthy
            valkey:
                condition: service_started
        volumes:
            - glitchtip-uploads:/code/uploads

    seaweedfs:
        image: chrislusf/seaweedfs:latest
        restart: unless-stopped
        environment:
            SEAWEEDFS_S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY}
            SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY}
        entrypoint: ['sh', '-c']
        command:
            - |
                mkdir -p /etc/seaweedfs
                cat > /etc/seaweedfs/s3-config.json <<EOF
                {
                  "identities": [
                    {
                      "name": "app",
                      "credentials": [{"accessKey": "$$SEAWEEDFS_S3_ACCESS_KEY", "secretKey": "$$SEAWEEDFS_S3_SECRET_KEY"}],
                      "actions": ["Read", "Write"]
                    }
                  ]
                }
                EOF
                exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3-config.json -ip.bind=0.0.0.0
        volumes:
            - seaweedfs-data:/data
        healthcheck:
            test: ['CMD-SHELL', 'nc -z localhost 8333 || exit 1']
            start_period: 15s
            interval: 10s
            timeout: 5s
            retries: 5

    flagsmith-migrate:
        image: docker.flagsmith.com/flagsmith/flagsmith:latest
        command: migrate
        restart: 'no'
        environment: *flagsmith-env
        depends_on:
            postgres:
                condition: service_healthy

    flagsmith:
        image: docker.flagsmith.com/flagsmith/flagsmith:latest
        command: serve
        restart: unless-stopped
        environment: *flagsmith-env
        depends_on:
            flagsmith-migrate:
                condition: service_completed_successfully

    uptime-kuma:
        image: louislam/uptime-kuma:2
        restart: unless-stopped
        volumes:
            - uptime-kuma-data:/app/data

    goatcounter:
        image: arp242/goatcounter
        restart: unless-stopped
        command: ['serve', '-listen', ':8080', '-tls', 'none']
        volumes:
            - goatcounter-data:/home/goatcounter/goatcounter-data

    ntfy:
        image: binwiederhier/ntfy
        restart: unless-stopped
        command: serve
        volumes:
            - ntfy-cache:/var/cache/ntfy
            - ntfy-lib:/var/lib/ntfy
            - ./ntfy/server.yml:/etc/ntfy/server.yml:ro

    openfga-migrate:
        image: openfga/openfga:latest
        command: migrate
        restart: 'no'
        environment: *openfga-env
        depends_on:
            postgres:
                condition: service_healthy

    openfga:
        image: openfga/openfga:latest
        command: run
        restart: unless-stopped
        environment: *openfga-env
        depends_on:
            openfga-migrate:
                condition: service_completed_successfully
    pgbackups:
        image: prodrigestivill/postgres-backup-local
        restart: unless-stopped
        user: postgres:postgres
        environment:
            POSTGRES_HOST: postgres
            POSTGRES_DB: ${GLITCHTIP_DB_NAME},${FLAGSMITH_DB_NAME},${OPENFGA_DB_NAME}
            POSTGRES_USER: ${POSTGRES_SUPERUSER}
            POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
            SCHEDULE: '@daily'
            BACKUP_KEEP_DAYS: 7
            BACKUP_KEEP_WEEKS: 4
            BACKUP_KEEP_MONTHS: 6
        volumes:
            - postgres-backups:/backups
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres-data:
    postgres-backups:
    valkey-data:
    glitchtip-uploads:
    seaweedfs-data:
    uptime-kuma-data:
    goatcounter-data:
    ntfy-cache:
    ntfy-lib:
